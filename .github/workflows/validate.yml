name: Validate database migrations

on:
  pull_request:
    paths:
      - "pom.xml"
      - "src/main/resources/db/changelog/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "pom.xml"
      - "src/main/resources/db/changelog/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate Liquibase changelog
        run: mvn --batch-mode --no-transfer-progress -Pvalidation liquibase:validate

