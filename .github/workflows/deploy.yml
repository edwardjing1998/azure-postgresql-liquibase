name: Deploy database migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and target database
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      deployment_mode:
        description: Preview SQL or apply migrations
        required: true
        type: choice
        options:
          - preview
          - apply
        default: preview

permissions:
  contents: read

concurrency:
  group: database-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: ${{ inputs.environment }}

    env:
      DB_URL: ${{ secrets.LIQUIBASE_URL }}
      DB_USERNAME: ${{ secrets.LIQUIBASE_USERNAME }}
      DB_PASSWORD: ${{ secrets.LIQUIBASE_PASSWORD }}

      # Always execute the master changelog.
      LIQUIBASE_CHANGELOG:
        src/main/resources/db/changelog/db.changelog-master.xml

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Sample users must only be inserted into DEV.
      - name: Select Liquibase context
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "dev" ]; then
            echo "DB_CONTEXTS=dev" >> "$GITHUB_ENV"
            echo "DEV context enabled: sample users will be included."
          else
            echo "DB_CONTEXTS=" >> "$GITHUB_ENV"
            echo "DEV context disabled: sample users will not be included."
          fi

      - name: Verify required database secrets
        shell: bash
        run: |
          if [ -z "$DB_URL" ]; then
            echo "LIQUIBASE_URL is missing from the selected GitHub Environment."
            exit 1
          fi

          if [ -z "$DB_USERNAME" ]; then
            echo "LIQUIBASE_USERNAME is missing from the selected GitHub Environment."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "LIQUIBASE_PASSWORD is missing from the selected GitHub Environment."
            exit 1
          fi

          echo "Required database secrets are configured."

      - name: Verify master changelog
        shell: bash
        run: |
          if [ ! -f "$LIQUIBASE_CHANGELOG" ]; then
            echo "Master changelog does not exist:"
            echo "$LIQUIBASE_CHANGELOG"
            exit 1
          fi

          echo "Using master changelog:"
          echo "$LIQUIBASE_CHANGELOG"

      - name: Verify retry-count migration is included
        shell: bash
        run: |
          if ! grep -Fq "011-add-retry-count.xml" "$LIQUIBASE_CHANGELOG"; then
            echo "011-add-retry-count.xml is not included in:"
            echo "$LIQUIBASE_CHANGELOG"
            exit 1
          fi

          echo "011-add-retry-count.xml is included by the master changelog."

      - name: Display selected configuration
        shell: bash
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Deployment mode: ${{ inputs.deployment_mode }}"
          echo "Liquibase contexts: $DB_CONTEXTS"
          echo "Master changelog: $LIQUIBASE_CHANGELOG"

      - name: Validate Liquibase changelog
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            -Dliquibase.changeLogFile="$LIQUIBASE_CHANGELOG" \
            -Dliquibase.contexts="$DB_CONTEXTS" \
            liquibase:validate

      - name: Show pending database changes
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            -Dliquibase.changeLogFile="$LIQUIBASE_CHANGELOG" \
            -Dliquibase.verbose=true \
            -Dliquibase.contexts="$DB_CONTEXTS" \
            liquibase:status

      - name: Generate migration SQL
        run: |
          mkdir -p generated-sql

          mvn \
            --batch-mode \
            --no-transfer-progress \
            -Dliquibase.changeLogFile="$LIQUIBASE_CHANGELOG" \
            -Dliquibase.contexts="$DB_CONTEXTS" \
            -Dliquibase.migrationSqlOutputFile="generated-sql/update-${{ inputs.environment }}.sql" \
            liquibase:updateSQL

      - name: Upload generated SQL
        uses: actions/upload-artifact@v4
        with:
          name: liquibase-sql-${{ inputs.environment }}-${{ github.run_number }}
          path: generated-sql/*.sql
          retention-days: 14
          if-no-files-found: error

      # This is the only step that changes PostgreSQL.
      - name: Apply migrations
        if: ${{ inputs.deployment_mode == 'apply' }}
        run: |
          echo "Applying Liquibase contexts: $DB_CONTEXTS"
          echo "Applying master changelog: $LIQUIBASE_CHANGELOG"

          mvn \
            --batch-mode \
            --no-transfer-progress \
            -Dliquibase.changeLogFile="$LIQUIBASE_CHANGELOG" \
            -Dliquibase.contexts="$DB_CONTEXTS" \
            liquibase:update

      - name: Display migration history
        if: ${{ inputs.deployment_mode == 'apply' }}
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            -Dliquibase.changeLogFile="$LIQUIBASE_CHANGELOG" \
            liquibase:history

      - name: Verify database migrations
        if: ${{ inputs.deployment_mode == 'apply' }}
        run: |
          echo "Checking for remaining pending changes."

          mvn \
            --batch-mode \
            --no-transfer-progress \
            -Dliquibase.changeLogFile="$LIQUIBASE_CHANGELOG" \
            -Dliquibase.verbose=true \
            -Dliquibase.contexts="$DB_CONTEXTS" \
            liquibase:status

      - name: Preview completed
        if: ${{ inputs.deployment_mode == 'preview' }}
        run: |
          echo "Preview completed successfully."
          echo "No database changes were applied."
          echo "Download the generated SQL artifact for review."

      - name: Deployment completed
        if: ${{ inputs.deployment_mode == 'apply' }}
        run: |
          echo "Liquibase migrations were applied successfully."
          echo "Target environment: ${{ inputs.environment }}"
          echo "Liquibase contexts: $DB_CONTEXTS"